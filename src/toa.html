<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>toa.sh</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0b0e14;
      color: #c9d1d9;
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.5;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .wrap { display: flex; flex-direction: column; height: 100vh; }
    .bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      flex: none;
      background: #151a24;
      border-bottom: 1px solid #262c3a;
      cursor: move;
    }
    .bar .title { flex: 1; font-weight: 700; font-size: 12px; color: #9aa3b2; letter-spacing: .05em; }
    .bar .title::before { content: "▞ "; color: #5b6b86; }
    .count { color: #5f6c82; font-size: 10px; min-width: 18px; text-align: right; }
    .btn {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; border-radius: 5px;
      color: #9aa3b2; cursor: pointer; padding: 0;
    }
    .btn:hover { background: #232a38; color: #e6edf3; }
    .btn svg { width: 14px; height: 14px; }
    .btn.copied { color: #56d364; }
    .body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 8px; scrollbar-width: thin; scrollbar-color: #2a3242 transparent; }
    .line { display: flex; gap: 6px; white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text; }
    .ts { flex: none; color: #444e5e; }
    .lv { flex: none; width: 46px; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .lv.log { color: #9aa3b2; }
    .lv.info { color: #79b8ff; }
    .lv.warn { color: #e5c07b; }
    .lv.error { color: #ff5f56; }
    .lv.rust { color: #56a8e0; }
    .empty { text-align: center; color: #4a5568; padding-top: 30%; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar" id="bar" data-tauri-drag-region>
      <span class="title">toa.sh</span>
      <span class="count" id="count"></span>
      <button class="btn" id="copyBtn" title="Copy log buffer">copy-svg</button>
      <button class="btn" id="minBtn" title="Minimize">min-svg</button>
      <button class="btn" id="closeBtn" title="Hide console">close-svg</button>
    </div>
    <div class="body" id="body">
      <div class="empty">Waiting for log lines…</div>
    </div>
  </div>
  <script type="module" src="toa-console.js"></script>
</body>
</html>
